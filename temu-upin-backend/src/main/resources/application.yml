server:
  tomcat:
    max-http-form-post-size: 100GB
    max-swallow-size: 100GB

spring:
  profiles:
    active: local   # 也可以不写，改用启动参数指定
  application:
    name: product-scene


  # This project does not use authentication/authorization.
  # Some upstream dependencies may bring in Spring Security transitively; disable its auto config.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://www.tminos.com:5432/tminos}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ${SPRING_DATASOURCE_HIKARI_POOL_NAME:ProductSceneHikari}
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:30}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:60000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:300000}
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  servlet:
    multipart:
      max-file-size: 100GB
      max-request-size: 100GB

# AI Image Generation Configuration
ai:
  text-channel:
    base-url: ${AI_TEXT_CHANNEL_BASE_URL:}
    api-key: ${AI_TEXT_CHANNEL_API_KEY:}

  image:
    providers:
      - name: stability
        enabled: true
        base-url: https://api.stability.ai
        api-key: ${STABILITY_API_KEY:}
        model: sd3
      - name: volcengine
        enabled: true
        api-key: ${VOLCENGINE_API_KEY:}
        api-secret: ${VOLCENGINE_API_SECRET:}
        model: img2img_real_mix_style
      - name: runway
        enabled: false
        api-key: ${RUNWAY_API_KEY:}
    
    prompt-optimizer:
      enabled: true
      provider: tminos
      base-url: ${PROMPT_OPTIMIZER_BASE_URL:${AI_TEXT_CHANNEL_BASE_URL:}}
      api-key: ${PROMPT_OPTIMIZER_API_KEY:${AI_TEXT_CHANNEL_API_KEY:}}
      model: ${PROMPT_OPTIMIZER_MODEL:gpt-5.5}

  image-translate:
    enabled: ${AI_IMAGE_TRANSLATE_ENABLED:true}
    base-url: ${AI_IMAGE_TRANSLATE_BASE_URL:${AI_TEXT_CHANNEL_BASE_URL:}}
    api-key: ${AI_IMAGE_TRANSLATE_API_KEY:${ai.text-channel.api-key:}}
    model: ${AI_IMAGE_TRANSLATE_MODEL:gpt-image-1.5}
    size: ${AI_IMAGE_TRANSLATE_SIZE:auto}
    quality: ${AI_IMAGE_TRANSLATE_QUALITY:medium}
    output-format: ${AI_IMAGE_TRANSLATE_OUTPUT_FORMAT:png}
    timeout-ms: ${AI_IMAGE_TRANSLATE_TIMEOUT_MS:300000}
    upload-to-oss-default: ${AI_IMAGE_TRANSLATE_UPLOAD_TO_OSS_DEFAULT:false}
    marketplace: ${AI_IMAGE_TRANSLATE_MARKETPLACE:Temu}
    source-language: ${AI_IMAGE_TRANSLATE_SOURCE_LANGUAGE:Chinese}
    target-language: ${AI_IMAGE_TRANSLATE_TARGET_LANGUAGE:English}

  temu-attr-filler:
    enabled: true
    base-url: ${TEMU_ATTR_AI_BASE_URL:${AI_TEXT_CHANNEL_BASE_URL:}}
    api-key: ${TEMU_ATTR_AI_API_KEY:${AI_TEXT_CHANNEL_API_KEY:}}
    model: ${TEMU_ATTR_AI_MODEL:gpt-5.5}
    timeout-ms: ${TEMU_ATTR_AI_TIMEOUT_MS:240000}
    max-tokens: ${TEMU_ATTR_AI_MAX_TOKENS:250000}

    # Special attribute rules (pid based)
    # - force-empty-pids: AI must NOT fill these pids (leave empty)
    # - required-input-nonzero-pids: when AI does fill these input pids, value must not be 0
    # Example: 电池容量（mAh） pid=1485, 银材料净克重(g） pid=2172 (must be empty)
    force-empty-pids: [1485, 2172]
    required-input-nonzero-pids: []
    required-input-nonzero-default: "1"

  temu-title-optimizer:
    enabled: ${TEMU_TITLE_OPTIMIZER_ENABLED:true}
    base-url: ${TEMU_TITLE_AI_BASE_URL:${AI_TEXT_CHANNEL_BASE_URL:}}
    api-key: ${TEMU_TITLE_AI_API_KEY:${AI_TEXT_CHANNEL_API_KEY:}}
    model: ${TEMU_TITLE_AI_MODEL:${TEMU_ATTR_AI_MODEL:gpt-5.2}}
    timeout-ms: ${TEMU_TITLE_AI_TIMEOUT_MS:240000}
    max-tokens: ${TEMU_TITLE_AI_MAX_TOKENS:1600}
    max-attempts: ${TEMU_TITLE_AI_MAX_ATTEMPTS:3}

  alibaba1688-selection-report:
    enabled: ${ALIBABA_1688_SELECTION_REPORT_AI_ENABLED:true}
    base-url: ${ALIBABA_1688_SELECTION_REPORT_AI_BASE_URL:${AI_TEXT_CHANNEL_BASE_URL:}}
    api-key: ${ALIBABA_1688_SELECTION_REPORT_AI_API_KEY:${AI_TEXT_CHANNEL_API_KEY:}}
    model: ${ALIBABA_1688_SELECTION_REPORT_AI_MODEL:${TEMU_ATTR_AI_MODEL:gpt-5.5}}
    timeout-ms: ${ALIBABA_1688_SELECTION_REPORT_AI_TIMEOUT_MS:240000}
    max-tokens: ${ALIBABA_1688_SELECTION_REPORT_AI_MAX_TOKENS:3200}
    
    default-settings:
      thumbnail:
        width: 800
        height: 800
        count: 1
      carousel:
        width: 1200
        height: 1200
        count: 5
      detail:
        width: 1200
        height: 1600
        count: 3

# CORS Configuration
cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

platform:
  auth:
    enabled: ${PLATFORM_AUTH_ENABLED:true}
    username: ${PLATFORM_AUTH_USERNAME:admin}
    password: ${PLATFORM_AUTH_PASSWORD:admin778899}
    token-secret: ${PLATFORM_AUTH_TOKEN_SECRET:product-scene-platform-auth-secret}
    token-ttl-hours: ${PLATFORM_AUTH_TOKEN_TTL_HOURS:168}

alibaba1688:
  worker-api:
    enabled: ${ALIBABA_1688_WORKER_API_ENABLED:true}
    key: ${ALIBABA_1688_WORKER_API_KEY:Han123...}
  selection-pool:
    detail-import-worker:
      enabled: ${ALIBABA_1688_SELECTION_DETAIL_IMPORT_WORKER_ENABLED:true}
      poll-ms: ${ALIBABA_1688_SELECTION_DETAIL_IMPORT_WORKER_POLL_MS:1200000}
      initial-delay-ms: ${ALIBABA_1688_SELECTION_DETAIL_IMPORT_WORKER_INITIAL_DELAY_MS:120000}

tminos:
  minio:
    enabled: ${TMINOS_MINIO_ENABLED:false}
    endpoint: ${TMINOS_MINIO_ENDPOINT:}
    public-endpoint: ${TMINOS_MINIO_PUBLIC_ENDPOINT:}
    access-key: ${TMINOS_MINIO_ACCESS_KEY:}
    secret-key: ${TMINOS_MINIO_SECRET_KEY:}
    bucket: ${TMINOS_MINIO_BUCKET:tminos}

temu:
  goods:
    access-token: ${TEMU_GOODS_ACCESS_TOKEN:}
    translate-poll-interval-ms: ${TEMU_TRANSLATE_POLL_INTERVAL_MS:2500}
    translate-poll-max-attempts: ${TEMU_TRANSLATE_POLL_MAX_ATTEMPTS:80}

  # Automatic background publishing (equivalent to clicking the publish button on product-collections)
  auto-publish:
    worker:
      enabled: ${TEMU_AUTO_PUBLISH_ENABLED:false}
      poll-ms: ${TEMU_AUTO_PUBLISH_POLL_MS:300000}

  main-sale-spec-infer:
    worker:
      enabled: ${TEMU_MAIN_SALE_SPEC_INFER_ENABLED:false}
      poll-ms: ${TEMU_MAIN_SALE_SPEC_INFER_POLL_MS:300000}

  attr-ai-fill:
    worker:
      enabled: ${TEMU_ATTR_AI_FILL_ENABLED:false}
      poll-ms: ${TEMU_ATTR_AI_FILL_POLL_MS:300000}

  order:
    auto-sync:
      enabled: ${TEMU_ORDER_AUTO_SYNC_ENABLED:true}
      poll-ms: ${TEMU_ORDER_AUTO_SYNC_POLL_MS:300000}
      initial-delay-ms: ${TEMU_ORDER_AUTO_SYNC_INITIAL_DELAY_MS:60000}
      incremental-hours: ${TEMU_ORDER_AUTO_SYNC_INCREMENTAL_HOURS:24}
      monthly-backfill-hours: ${TEMU_ORDER_AUTO_SYNC_MONTHLY_BACKFILL_HOURS:720}
      monthly-backfill-cron: ${TEMU_ORDER_AUTO_SYNC_MONTHLY_BACKFILL_CRON:0 35 2 * * *}
      logistics-hours: ${TEMU_ORDER_AUTO_SYNC_LOGISTICS_HOURS:720}
      logistics-limit-per-shop: ${TEMU_ORDER_AUTO_SYNC_LOGISTICS_LIMIT_PER_SHOP:20}
      aftersale-open-refresh-enabled: ${TEMU_ORDER_AUTO_SYNC_AFTERSALE_OPEN_REFRESH_ENABLED:true}
      aftersale-open-refresh-ms: ${TEMU_ORDER_AUTO_SYNC_AFTERSALE_OPEN_REFRESH_MS:3600000}
      aftersale-open-refresh-initial-delay-ms: ${TEMU_ORDER_AUTO_SYNC_AFTERSALE_OPEN_REFRESH_INITIAL_DELAY_MS:120000}

# Import-time title cleanup
import:
  title-clean:
    remove-keywords: []



# Global post-import worker poll interval (ms)
post-import:
  worker:
    poll-ms: 300000
